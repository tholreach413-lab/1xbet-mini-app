<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M64 8 C88 8 114 18 114 42 C114 78 88 108 64 120 C40 108 14 78 14 42 C14 18 40 8 64 8 Z" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Shield Trim -->
  <path d="M64 14 C84 14 106 23 106 43 C106 74 84 102 64 112 C44 102 22 74 22 43 C22 23 44 14 64 14 Z" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Team Custom Mascot/Symbol -->
  <g transform="translate(0, 0)">
    
      <!-- Myanmar Lion / Galactic Star Crest -->
      <polygon points="64,22 74,44 98,44 79,59 86,82 64,68 42,82 49,59 30,44 54,44" fill="url(#accGrad)" filter="url(#glow)"/>
      <circle cx="64" cy="52" r="14" fill="#0a1128" stroke="#f59e0b" stroke-width="2.5"/>
      <path d="M57 52 L64 43 L71 52 L64 61 Z" fill="#38bdf8"/>
    
  </g>

  <!-- Bottom Team Banner -->
  <path d="M30 88 L64 84 L98 88 L92 102 L64 107 L36 102 Z" fill="#09090b" opacity="0.85" stroke="#f59e0b" stroke-width="1"/>
  
  <!-- Typography Initials -->
  <text x="64" y="99" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="1" fill="#ffffff" text-anchor="middle">YG</text>
</svg>